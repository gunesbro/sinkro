name: Release

# Pushing a tag like v0.1.0, matching extension/package.json, checks everything, builds the
# packages and publishes them as a GitHub release. Run by hand, it only builds them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional. With them, a tag sends the Firefox package to Firefox Add-ons for review.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the tag matches the extension's version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but extension/package.json says $version."
            exit 1
          fi

      - run: npm run check
      - run: npm run package -w extension

      # Run by hand, this only says whether AMO already has this version, to check the keys work.
      - name: Check what Firefox Add-ons has
        if: github.ref_type != 'tag' && env.AMO_JWT_ISSUER != ''
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "AMO has $version: $(node extension/scripts/amo-has-version.mjs "$version")"

      - name: Send the Firefox package to Firefox Add-ons
        if: github.ref_type == 'tag' && env.AMO_JWT_ISSUER != ''
        run: |
          # AMO takes each version number once, and one may have gone up by hand already.
          version=$(node -p "require('./extension/package.json').version")
          if [ "$(node extension/scripts/amo-has-version.mjs "$version")" = "yes" ]; then
            echo "Firefox Add-ons already has $version, so it isn't sent again."
            exit 0
          fi
          # The extension is bundled, so Mozilla's reviewers get the readable source with it.
          git archive --format=zip -o "$RUNNER_TEMP/sinkro-source.zip" HEAD
          # Listed: it goes to review and then to everyone through Firefox's own updates. There's no
          # signed file to wait for, so the release doesn't wait on the review.
          npx web-ext sign             --source-dir extension/dist/firefox             --artifacts-dir extension/release             --channel listed             --approval-timeout 0             --api-key "$AMO_JWT_ISSUER"             --api-secret "$AMO_JWT_SECRET"             --upload-source-code "$RUNNER_TEMP/sinkro-source.zip"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(extension/release/*.zip extension/release/*.xpi)
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Sinkro is in the Chrome Web Store, which also installs it in Edge: https://chromewebstore.google.com/detail/sinkro-%E2%80%94-watch-party-sync/gndjbfbcaaffalmlcjlhofbboopbcgdc

          Sinkro is in Firefox Add-ons: https://addons.mozilla.org/en-GB/firefox/addon/sinkro/

          **Chrome or Edge:** install it from the Chrome Web Store link above. The `sinkro-chrome-*.zip` below is the same build, to load by hand: unzip it, open `chrome://extensions` or `edge://extensions`, turn on developer mode, choose **Load unpacked** and select the unzipped folder.

          **Firefox:** install it from Firefox Add-ons, which also brings updates. The `sinkro-firefox-*.zip` below is the same build, to load by hand: open `about:debugging#/runtime/this-firefox`, choose **Load Temporary Add-on** and pick the zip; it goes away when Firefox closes.
          NOTES
          # A rerun, say after adding the signing keys, adds to the release it made before.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Sinkro $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Keep the packages from a run by hand
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sinkro-packages
          path: extension/release
